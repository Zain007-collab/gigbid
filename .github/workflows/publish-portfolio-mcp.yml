name: publish-portfolio-mcp
on:
  push: { branches: [main], paths: ["mcp_servers/portfolio/**", "rag/**", "infra/docker/portfolio-mcp.Dockerfile"] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/portfolio-mcp.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gigbid-portfolio-mcp:latest
