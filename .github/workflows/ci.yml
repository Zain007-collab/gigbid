name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    env: { GIGBID_OFFLINE: "1", RAG_EMBED_BACKEND: hash, GIGBID_MCP_TRANSPORT: memory }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --only-binary :all: -r requirements.lock.txt pytest anyio ruff
      - name: Repo rules (secrets, frozen gigsim/, prompts only in agent/prompts, README numbers from evals/results)
        run: python scripts/check_repo_rules.py
      - name: Lint
        run: ruff check agent rag mcp_servers apps/api worker evals shared --select E9,F63,F7,F82,F401
      - name: Unit, contract (tool-schema snapshots) and integration tests
        run: pytest -q
  web:
    runs-on: ubuntu-latest
    env: { GIGBID_OFFLINE: "1", RAG_EMBED_BACKEND: hash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          python -m venv .venv && .venv/bin/pip install --only-binary :all: -r requirements.lock.txt
      - working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts || (echo "generated API client is stale: run npm run gen:api" && exit 1)
          npx tsc -b && npx vite build
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }
